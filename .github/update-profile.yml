name: Update GitHub profile

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Create output directory
        run: mkdir -p profile

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_title=true&hide_border=true&bg_color=00000000&text_color=8B949E&icon_color=8B5CF6"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=5&card_width=250&custom_title=Top%20Languages&hide_border=true&bg_color=00000000&title_color=8B5CF6&text_color=8B949E"
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak from GitHub contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$PROFILE_LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    weeks {
                      contributionDays { date contributionCount }
                    }
                  }
                }
              }
            }' > "$RUNNER_TEMP/profile-contributions.json"

          python3 - <<'PY'
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from datetime import datetime

          source = Path(os.environ["RUNNER_TEMP"]) / "profile-contributions.json"
          calendar = json.loads(source.read_text())["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          counts = {
              date.fromisoformat(day["date"]): day["contributionCount"]
              for week in calendar["weeks"]
              for day in week["contributionDays"]
              if date.fromisoformat(day["date"]) <= today
          }
          if not counts:
              raise RuntimeError("GitHub returned an empty contribution calendar")

          current = longest = run = 0
          day = min(counts)
          while day <= today:
              run = run + 1 if counts.get(day, 0) else 0
              longest = max(longest, run)
              day += timedelta(days=1)

          day = today if counts.get(today, 0) else today - timedelta(days=1)
          while counts.get(day, 0):
              current += 1
              day -= timedelta(days=1)

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="520" height="46" viewBox="0 0 520 46" role="img">
            <title>Current streak: {current} days. Longest in the last year: {longest} days.</title>
            <text x="260" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#8B949E">Current streak <tspan fill="#8B5CF6" font-weight="700">{current}d</tspan> · Best this year <tspan fill="#8B5CF6" font-weight="700">{longest}d</tspan></text>
          </svg>"""
          Path("profile/streak.svg").write_text(svg, encoding="utf-8")
          PY

      - name: Save updated images
        run: |
          git add profile/snake.svg profile/snake-dark.svg profile/stats.svg profile/languages.svg profile/streak.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh GitHub profile"
          git push
