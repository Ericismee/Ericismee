name: Generate Pac-Man
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pacman.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
permissions: {}
concurrency: profile-pacman
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          hide_month_labels: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: pacman-svg
          path: dist/pacman-contribution-graph*.svg
          if-no-files-found: error
  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pacman-svg
          path: dist
      - name: Publish the two SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          for name in pacman-contribution-graph.svg pacman-contribution-graph-dark.svg; do
            test -s "dist/$name"
            test ! -L "dist/$name"
          done
          mkdir publish
          git -C publish init -b output-pacman
          git -C publish remote add origin "$remote"
          if git ls-remote --exit-code --heads "$remote" refs/heads/output-pacman; then
            git -C publish fetch --depth=1 origin output-pacman
            git -C publish reset --hard FETCH_HEAD
          else
            test "$?" -eq 2
          fi
          cp dist/pacman-contribution-graph.svg dist/pacman-contribution-graph-dark.svg publish/
          git -C publish add -- pacman-contribution-graph.svg pacman-contribution-graph-dark.svg
          if git -C publish diff --cached --quiet; then exit 0; fi
          git -C publish -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Pac-Man contribution graph'
          git -C publish push origin HEAD:refs/heads/output-pacman
