name: Generate Snake

on:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
  schedule:
    - cron: "0 0 * * *" # chạy hàng ngày lúc 0h UTC
  workflow_dispatch:     # cho phép chạy thủ công

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%237C3AED&color_dots=%23E8EDF4,%23A7F3D0,%235EEAD4,%2314B8A6,%230F766E
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F0ABFC&color_dots=%23232B39,%23357070,%232DD4BF,%236EE7B7,%23C5FFE4

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
